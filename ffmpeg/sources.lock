  "pulled": {
    "comment": "What configure enables beside the lists above, through the _select lines of FFmpeg's configure (build.py closure reads them; tests/test_ffmpeg.py checks this list against them): the vp3 decoder for theora, the bitstream filters of the vp9 decoder and of the MP4 and Matroska muxers, and the rotate filter the ffmpeg program always asks for.",
    "decoder": ["vp3"],
    "bsf": ["pgs_frame_merge", "vp9_superframe", "vp9_superframe_split"],
    "filter": ["rotate"]
  },
  "printed": {
    "comment": "wrapped_avframe (encoder and decoder): the frames of the lavfi device and of the null muxer travel as wrapped frames, so the one second encoder test of the plan (-f lavfi -i color ... -f null -) needs both. The names the program prints where they differ from the names of configure, and what it always prints. --enable-d3d11va on Windows: mfenc.c of FFmpeg 9.0 uses the D3D11 types of the media foundation encoders whether d3d11va is on or not (the hardware context only, no decoder or hwaccel component).",
    "demuxer": {"mov": "mov,mp4,m4a,3gp,3g2,mj2", "matroska": "matroska,webm", "mpegps": "mpeg"},
    "bsf": {"dump_extradata": "dump_extra"},
    "filter_always": ["abuffer", "abuffersink", "buffer", "buffersink"]
  },
